<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我们">
<meta name="theme-color" content="#ff7a9c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>我们的空间</title>
<style>
:root {
  --pink: #ff7a9c;
  --pink-deep: #e84a6f;
  --bg: #fff5f7;
  --card: #ffffff;
  --text: #3a2b30;
  --muted: #a08a90;
  --radius: 16px;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--bg); color: var(--text);
  padding-bottom: calc(70px + env(safe-area-inset-bottom));
  max-width: 640px; margin: 0 auto;
}
header {
  padding: calc(16px + env(safe-area-inset-top)) 20px 14px;
  background: linear-gradient(135deg, #ff9eb5, #ff7a9c);
  color: #fff; position: sticky; top: 0; z-index: 10;
}
header h1 { font-size: 20px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
header .sub { font-size: 12px; opacity: .9; margin-top: 2px; }
nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; background: #fff;
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  border-top: 1px solid #ffe3ea; z-index: 10;
}
nav button {
  flex: 1; border: none; background: none; font-size: 11px;
  color: var(--muted); padding: 4px 0; cursor: pointer;
}
nav button .ico { font-size: 22px; display: block; line-height: 1.2; }
nav button.active { color: var(--pink-deep); font-weight: 600; }
main { padding: 16px; }
.card {
  background: var(--card); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 12px;
  box-shadow: 0 2px 10px rgba(232,74,111,.06);
}
.card .row { display: flex; justify-content: space-between; gap: 10px; }
.card h3 { font-size: 15px; margin-bottom: 4px; }
.card .meta { font-size: 12px; color: var(--muted); }
.card .body { font-size: 14px; margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
.del { border: none; background: none; color: #e0b6bf; font-size: 16px; cursor: pointer; padding: 0 4px; }
.big-num { font-size: 34px; font-weight: 800; color: var(--pink-deep); }
.fab {
  position: fixed; right: 20px; bottom: calc(84px + env(safe-area-inset-bottom));
  width: 54px; height: 54px; border-radius: 50%; border: none;
  background: var(--pink); color: #fff; font-size: 28px; line-height: 1;
  box-shadow: 0 6px 16px rgba(232,74,111,.35); cursor: pointer; z-index: 11;
}
/* 旧版浏览器不支持 <dialog> 时的降级样式：模拟居中弹窗 */
dialog.no-dialog-support {
  position: fixed; inset: 0; margin: auto; display: none;
  height: fit-content; z-index: 100; background: #fff;
}
dialog.no-dialog-support[open] { display: block; }
dialog.no-dialog-support::backdrop { display: none; }
dialog.no-dialog-support + .dlg-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 99;
}
dialog.no-dialog-support[open] + .dlg-backdrop { display: block; }
.dlg-backdrop { display: none; }
.dlg-backdrop.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 99; }

/* 弹窗 */
dialog {
  border: none; border-radius: 20px; padding: 20px;
  width: min(92vw, 420px); background: #fff;
  /* 居中显示（部分浏览器/旧版 iOS 不用默认的 margin:auto） */
  margin: auto;
  max-height: 85vh; max-height: 85dvh; overflow-y: auto;
}
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog h2 { font-size: 17px; margin-bottom: 14px; color: var(--pink-deep); }
label { font-size: 12px; color: var(--muted); display: block; margin: 12px 0 4px; }
input, textarea {
  width: 100%; border: 1.5px solid #ffd9e2; border-radius: 10px;
  padding: 10px 12px; font-size: 15px; font-family: inherit; background: #fffafc;
}
input:focus, textarea:focus { outline: none; border-color: var(--pink); }
textarea { min-height: 90px; resize: vertical; }
.btn {
  margin-top: 16px; width: 100%; border: none; border-radius: 12px;
  padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
  background: linear-gradient(135deg, #ff9eb5, #ff7a9c); color: #fff;
}
.btn.ghost { background: none; color: var(--muted); box-shadow: none; margin-top: 8px; }
/* 照片墙 */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid .ph { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #ffe3ea; }
.grid .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.grid .ph .note {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,.55)); color: #fff;
  font-size: 11px; padding: 14px 6px 4px;
}
.grid .ph .del {
  position: absolute; top: 4px; right: 4px; color: #fff;
  background: rgba(0,0,0,.4); border-radius: 50%; width: 22px; height: 22px; font-size: 12px;
}
/* 设置页 */
.hint { font-size: 12px; color: var(--muted); line-height: 1.7; margin-top: 10px; }
.hint code { background: #ffeef2; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 0; }
.badge { font-size: 11px; background: #ffeef2; color: var(--pink-deep); border-radius: 8px; padding: 2px 8px; }
.photo-viewer img { width: 100%; border-radius: 12px; }
</style>
</head>
<body>

<header>
  <h1><span id="pageTitle">我们的空间</span><button id="btnSettings" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer">⚙︎</button></h1>
  <div class="sub" id="headerSub"></div>
</header>

<!-- 首页：纪念日 -->
<section id="tab-home">
  <main>
    <div class="card" style="text-align:center;background:linear-gradient(135deg,#fff0f4,#ffe3ec)">
      <div style="font-size:13px;color:var(--muted)">在一起</div>
      <div class="big-num" id="loveDays">—</div>
      <div style="font-size:12px;color:var(--muted)" id="loveSince"></div>
    </div>
    <div class="card" id="moodCard">
      <div class="row" style="align-items:center">
        <div style="font-size:13px;color:var(--muted)">💕 此刻心情</div>
        <button class="badge" style="border:none;cursor:pointer" onclick="openMoodHistory()">历史 ›</button>
      </div>
      <div id="moodBox" style="display:flex;gap:10px;margin-top:10px"></div>
    </div>
    <div class="card" id="memoryCard">
      <div class="row" style="align-items:center;cursor:pointer" onclick="toggleMemory()">
        <div style="font-size:13px;color:var(--muted)">🎞️ 今日回忆</div>
        <div style="display:flex;align-items:center;gap:8px">
          <button class="badge" style="border:none;cursor:pointer" onclick="event.stopPropagation();shuffleMemory()">换一张 ⟳</button>
          <span id="memoryArrow" style="color:var(--muted);font-size:12px">▸</span>
        </div>
      </div>
      <div id="memoryBox" style="margin-top:10px;display:none"></div>
    </div>
    <div id="anniversaryList"></div>
  </main>
</section>

<!-- 备忘录 -->
<section id="tab-memo" hidden>
  <main><div id="memoList"></div></main>
</section>

<!-- 照片墙 -->
<section id="tab-photo" hidden>
  <main><div class="grid" id="photoGrid"></div></main>
</section>

<!-- 留言板 -->
<section id="tab-board" hidden>
  <main>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input id="boardInput" placeholder="给 TA 留一句话…" maxlength="200" style="flex:1" onkeydown="if(event.key==='Enter')sendBoard()">
      <button class="btn" style="width:auto;margin:0;padding:10px 18px" onclick="sendBoard()">💌</button>
    </div>
    <div id="boardList"></div>
  </main>
</section>

<!-- 设置 -->
<section id="tab-settings" hidden>
  <main>
    <div class="card">
      <h2 style="font-size:16px;color:var(--pink-deep);margin-bottom:4px">我的身份</h2>
      <p class="hint">填你的昵称，用于区分你和伴侣的心情记录。两人填不同的名字。</p>
      <label>我的昵称</label>
      <input id="cfgName" placeholder="如：小猪 / 宝宝" maxlength="10">
      <button class="btn" id="btnSaveName">保存</button>
    </div>
    <div class="card">
      <h2 style="font-size:16px;color:var(--pink-deep);margin-bottom:4px">云同步设置</h2>
      <p class="hint">两人各自在设置里填入同一个 Supabase 地址和密钥，数据即自动同步。</p>
      <label>Supabase URL</label>
      <input id="cfgUrl" placeholder="https://xxxx.supabase.co">
      <label>Anon Key</label>
      <input id="cfgKey" placeholder="eyJhbGciOi...">
      <button class="btn" id="btnSaveCfg">保存并同步</button>
      <button class="btn ghost" id="btnSyncNow">立即同步</button>
    </div>
    <div class="card">
      <h2 style="font-size:16px;color:var(--pink-deep);margin-bottom:4px">在一起的日子</h2>
      <label>恋爱开始日期</label>
      <input type="date" id="cfgLoveDate">
      <button class="btn" id="btnSaveLove">保存</button>
    </div>
    <div class="card">
      <h2 style="font-size:16px;color:var(--pink-deep);margin-bottom:4px">数据备份</h2>
      <button class="btn ghost" id="btnExport" style="margin-top:4px">导出全部数据（JSON）</button>
      <p class="hint">建议每月导出一次存到 iCloud / 微信收藏，防止云端意外。</p>
    </div>
    <div class="card">
      <h2 style="font-size:16px;color:var(--pink-deep);margin-bottom:4px">关于与更新</h2>
      <div style="font-size:13px;color:var(--muted);margin-top:6px">当前版本 <b id="verNow" style="color:var(--text)"></b></div>
      <button class="btn ghost" id="btnCheckUpdate" style="margin-top:10px">检查更新</button>
      <p class="hint" id="updateStatus">点击后从服务器获取最新版本；如有更新会自动清缓存并刷新，你的配置和数据不受影响。</p>
    </div>
  </main>
</section>

<nav>
  <button data-tab="home" class="active"><span class="ico">💗</span>首页</button>
  <button data-tab="memo"><span class="ico">📝</span>备忘</button>
  <button data-tab="photo"><span class="ico">📷</span>照片</button>
  <button data-tab="board"><span class="ico">💬</span>留言</button>
  <button data-tab="settings"><span class="ico">⚙︎</span>设置</button>
</nav>

<button class="fab" id="fab">＋</button>

<!-- 新增弹窗 -->
<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <form id="dlgForm" method="dialog">
    <div id="dlgFields"></div>
    <button class="btn" type="submit" id="dlgSubmit">保存</button>
    <button class="btn ghost" type="button" id="dlgCancel">取消</button>
  </form>
</dialog>
<div class="dlg-backdrop" id="dlgBackdrop"></div>

<!-- 照片查看 -->
<dialog id="photoViewer" class="photo-viewer"></dialog>

<!-- 心情选择 -->
<dialog id="moodDlg">
  <h2>现在的心情是…</h2>
  <div id="moodEmojis" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px"></div>
  <input id="moodText" placeholder="想说的一句话（可选）" maxlength="50">
  <button class="btn" id="btnSaveMood">记录</button>
  <button class="btn ghost" type="button" id="moodCancel">取消</button>
</dialog>

<!-- 心情历史 -->
<dialog id="moodHistDlg">
  <h2>📖 心情历史</h2>
  <div id="moodHistList" style="max-height:60vh;overflow-y:auto"></div>
  <button class="btn ghost" type="button" id="moodHistClose">关闭</button>
</dialog>

<!-- 纪念日祝福 -->
<dialog id="blessDlg">
  <div id="blessContent" style="text-align:center;padding:8px 0"></div>
  <button class="btn" type="button" id="blessClose">开心收下 🎁</button>
</dialog>

<script>
/* ================= 配置与状态 ================= */
const APP_VERSION = '1.5.0';   // 每次发布新版记得改这里
const LS_CFG = 'cs_cfg', LS_LOVE = 'cs_love_date', LS_NAME = 'cs_name';
const MOODS = ['🥰','😄','😊','😌','😐','😴','😢','😤','😫','🤒'];
let cfg = JSON.parse(localStorage.getItem(LS_CFG) || 'null'); // {url, key}
let loveDate = localStorage.getItem(LS_LOVE) || '';
let myName = localStorage.getItem(LS_NAME) || '';
let moodPick = null;   // 心情选择器当前选中 emoji
let items = [];        // 全部条目 [{id,type,title,content,date,photo,created_at}]
let pending = [];      // 离线待同步队列
let currentTab = 'home';
const scrollPos = {};   // 每个标签记住的滚动位置
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));

/* 弹窗打开/关闭：不支持 <dialog> 的浏览器自动降级为居中浮层 */
const dialogSupported = typeof HTMLDialogElement !== 'undefined' && 'showModal' in HTMLDialogElement.prototype;
function openDlg(d) {
  if (dialogSupported) d.showModal();
  else { d.classList.add('no-dialog-support'); d.open = true; $('#dlgBackdrop').classList.add('show'); }
}
function closeDlg(d) {
  if (dialogSupported) d.close();
  else { d.open = false; $('#dlgBackdrop').classList.remove('show'); }
}
$('#dlgBackdrop')?.addEventListener('click', () => { closeDlg($('#dlg')); closeDlg($('#photoViewer')); });

/* ================= Supabase REST ================= */
function sb(path, opts = {}) {
  if (!cfg) return Promise.reject('未配置');
  return fetch(cfg.url + '/rest/v1/' + path, {
    ...opts,
    headers: {
      'apikey': cfg.key,
      'Authorization': 'Bearer ' + cfg.key,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...(opts.headers || {})
    }
  });
}

async function sync() {
  if (!cfg) return;
  // 推送离线变更（upsert 语义，幂等可重试）；只移除推送成功的，失败的留在队列
  const done = [];
  for (const op of pending) {
    try {
      if (op.action === 'delete') {
        const r = await sb('entries?id=eq.' + op.id, { method: 'DELETE' });
        if (r.ok) done.push(op);
        else console.error('推送删除失败', r.status, await r.text());
      } else {
        const r = await sb('entries', {
          method: 'POST',
          headers: { 'Prefer': 'resolution=merge-duplicates' },
          body: JSON.stringify(op.item)
        });
        if (r.ok) done.push(op);
        else console.error('推送失败', r.status, await r.text());
      }
    } catch (e) { console.error('推送异常', e); }
  }
  pending = pending.filter(op => !done.includes(op));
  // 拉取远端
  try {
    const res = await sb('entries?select=*', { method: 'GET' });
    if (res.ok) {
      const remote = await res.json();
      if (pending.length === 0) {
        // 全部推送成功：以远端为准（删除会在其他设备生效）
        items = remote;
      } else {
        // 有推送失败的：合并，避免覆盖本地未上传的条目
        const map = new Map(remote.map(r => [r.id, r]));
        for (const i of items) if (pending.some(p => p.item?.id === i.id || p.id === i.id)) map.set(i.id, i);
        items = [...map.values()];
      }
      saveLocal(); render();
      setSub(pending.length ? `本地 ${pending.length} 条待同步 · 推送失败` : '已同步 · ' + new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}));
    } else {
      const errText = await res.text().catch(() => '');
      setSub('同步失败 HTTP ' + res.status);
      console.error('拉取失败', res.status, errText);
      alert('同步失败（HTTP ' + res.status + '）：\n' + errText.slice(0, 200));
    }
  } catch (e) {
    setSub('同步失败：无法连接');
    console.error('拉取异常', e);
  }
}

function saveLocal() {
  try {
    localStorage.setItem('cs_items', JSON.stringify(items));
  } catch (e) {
    // 超出 localStorage 配额（约5MB，通常是照片）：降级为不缓存照片，仅内存保留
    try {
      localStorage.setItem('cs_items', JSON.stringify(items.filter(i => i.type !== 'photo')));
    } catch (e2) { console.warn('本地缓存已满', e2); }
  }
  try { localStorage.setItem('cs_pending', JSON.stringify(pending)); } catch (e) {}
}

/* 本地优先：先写本地，再尝试云端 */
function addItem(item) {
  items.unshift(item); pending.push({ action: 'upsert', item });
  saveLocal(); render();
  if (cfg) sb('entries', {
    method: 'POST',
    headers: { 'Prefer': 'resolution=merge-duplicates' },
    body: JSON.stringify(item)
  })
    .then(r => { if (r.ok) { pending = pending.filter(p => p.item?.id !== item.id); saveLocal(); } })
}
function delItem(id) {
  items = items.filter(i => i.id !== id); pending.push({ action: 'delete', id });
  saveLocal(); render();
  if (cfg) sb('entries?id=eq.' + id, { method: 'DELETE' })
    .then(() => { pending = pending.filter(p => p.id !== id); saveLocal(); }).catch(() => {});
}

/* ================= 渲染 ================= */
function setSub(t) { $('#headerSub').textContent = t; }

function render() {
  renderHome(); renderMemo(); renderPhoto(); renderBoard(); renderMemory();
}

function renderHome() {
  renderMoods();
  if (loveDate) {
    const days = Math.floor((Date.now() - new Date(loveDate)) / 86400000);
    $('#loveDays').textContent = days + ' 天';
    $('#loveSince').textContent = '自 ' + loveDate;
  }
  const list = items.filter(i => i.type === 'anniversary').sort((a, b) => (a.date || '') < (b.date || '') ? -1 : 1);
  $('#anniversaryList').innerHTML = list.length ? list.map(a => {
    let remain = '';
    if (a.date) {
      const d = new Date(a.date + 'T00:00:00');
      const now = new Date(); now.setHours(0,0,0,0);
      let next = new Date(now.getFullYear(), d.getMonth(), d.getDate());
      if (next < now) next = new Date(now.getFullYear() + 1, d.getMonth(), d.getDate());
      const diff = Math.round((next - now) / 86400000);
      remain = diff === 0 ? '🎂 就是今天！' : `还有 ${diff} 天`;
    }
    return `<div class="card"><div class="row"><div>
      <h3>${esc(a.title)}</h3>
      <div class="meta">${esc(a.date || '')} · ${remain}</div>
      ${a.content ? `<div class="body">${esc(a.content)}</div>` : ''}
    </div><button class="del" onclick="delItem('${a.id}')">✕</button></div></div>`;
  }).join('') : '<div class="empty">还没有纪念日，点右下角 ＋ 添加</div>';
}

/* ================= 心情 ================= */
function moods() { return items.filter(i => i.type === 'mood'); }

function renderMoods() {
  const all = moods();
  // 收集出现过的昵称（保证对方即使还没记录也显示占位）
  const names = [...new Set([myName, ...all.map(m => m.title)].filter(Boolean))];
  $('#moodBox').innerHTML = names.map(n => {
    const m = all.find(x => x.title === n);
    const isMe = n === myName;
    const time = m ? timeAgo(m.created_at) : '';
    return `<div style="flex:1;text-align:center;padding:10px;border-radius:12px;background:#fffafc;${isMe ? 'cursor:pointer' : ''}" ${isMe ? `onclick="openMoodDlg()"` : ''}>
      <div style="font-size:34px;line-height:1.2">${m ? m.note : '🫥'}</div>
      <div style="font-size:12px;font-weight:600;margin-top:4px">${esc(n)}${isMe ? ' <span style="color:var(--muted);font-weight:400">(点我改)</span>' : ''}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px">${m?.content ? esc(m.content) : time}</div>
      ${m?.content && time ? `<div style="font-size:11px;color:var(--muted);margin-top:1px">${time}</div>` : ''}
    </div>`;
  }).join('') || '<div class="empty" style="padding:10px">到设置页填昵称后即可记录心情</div>';
}

function timeAgo(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  return new Date(iso).toLocaleDateString('zh-CN');
}

function openMoodDlg() {
  if (!myName) { switchTab('settings'); alert('请先在设置页填写你的昵称'); return; }
  moodPick = null;
  $('#moodEmojis').innerHTML = MOODS.map(e =>
    `<button type="button" style="font-size:28px;padding:8px 0;border:2px solid #ffd9e2;border-radius:10px;background:#fff" onclick="pickMood(this,'${e}')">${e}</button>`
  ).join('');

/* 纪念日祝福：打开 app 时检查今天是否命中 */
function checkBlessing() {
  const today = new Date();
  const md = (d) => `${d.getMonth() + 1}-${d.getDate()}`;
  const hits = [];
  // 恋爱周年
  if (loveDate) {
    const ld = new Date(loveDate + 'T00:00:00');
    if (md(ld) === md(today) && today > ld) {
      const years = today.getFullYear() - ld.getFullYear();
      hits.push(years > 0 ? `🎉 今天是你们在一起 <b>${years} 周年</b>！` : '🎉 今天是你们在一起的第一年纪念日！');
    }
  }
  // 纪念日
  for (const a of items.filter(i => i.type === 'anniversary' && i.date)) {
    const d = new Date(a.date + 'T00:00:00');
    if (md(d) === md(today)) {
      const years = today.getFullYear() - d.getFullYear();
      hits.push(`🎂 今天是 <b>${esc(a.title)}</b>${years > 0 ? ` ${years} 周年` : ''}！`);
    }
  }
  if (!hits.length) return;
  // 每天只提示一次
  const key = 'cs_blessed_' + today.toISOString().slice(0, 10);
  if (localStorage.getItem(key)) return;
  localStorage.setItem(key, '1');
  $('#blessContent').innerHTML = `
    <div style="font-size:52px;line-height:1.3">🎊</div>
    ${hits.map(h => `<div style="font-size:16px;margin-top:10px;line-height:1.6">${h}</div>`).join('')}
    <div style="font-size:13px;color:var(--muted);margin-top:8px">去给 TA 留个言吧 💕</div>`;
  openDlg($('#blessDlg'));
}
$('#blessClose').addEventListener('click', () => closeDlg($('#blessDlg')));

/* ================= 今日回忆 ================= */
let memoryShuffled = false;
let memoryOpen = localStorage.getItem('cs_memory_open') === '1';
function toggleMemory() {
  memoryOpen = !memoryOpen;
  localStorage.setItem('cs_memory_open', memoryOpen ? '1' : '0');
  applyMemoryOpen();
}
function applyMemoryOpen() {
  $('#memoryBox').style.display = memoryOpen ? '' : 'none';
  $('#memoryArrow').textContent = memoryOpen ? '▾' : '▸';
}
function pickMemory() {
  const photos = items.filter(i => i.type === 'photo' && i.photo);
  if (!photos.length) return null;
  if (memoryShuffled) return photos[Math.floor(Math.random() * photos.length)];
  // 按日期做种子：每天固定一张，两人当天看到同一张
  const seed = new Date().toISOString().slice(0, 10);
  let h = 0;
  for (const c of seed) h = (h * 31 + c.charCodeAt(0)) % 99991;
  return photos[h % photos.length];
}
function renderMemory() {
  const p = pickMemory();
  $('#memoryBox').innerHTML = p ? `
    <div style="cursor:pointer" onclick="viewPhoto('${p.id}')">
      <img src="${p.photo}" style="width:100%;border-radius:12px;aspect-ratio:16/10;object-fit:cover;display:block">
      <div style="font-size:12px;color:var(--muted);margin-top:6px;text-align:center">
        ${p.content || p.note ? esc(p.note || p.content) + ' · ' : ''}${(p.created_at || '').slice(0, 10) || '某段时光'}
      </div>
    </div>` : '<div class="empty" style="padding:10px">照片墙还没有照片，去传几张吧</div>';
}
function shuffleMemory() { memoryShuffled = true; renderMemory(); }

/* ================= Tab 切换 ================= */
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
function switchTab(tab) {
  const prevTab = currentTab;
  currentTab = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  ['home', 'memo', 'photo', 'board', 'settings'].forEach(t => $('#tab-' + t).hidden = t !== tab);
  $('#fab').style.display = (tab === 'home' || tab === 'memo' || tab === 'photo') ? '' : 'none';
  $('#pageTitle').textContent = { home: '我们的空间', memo: '备忘录', photo: '照片墙', board: '留言板', settings: '设置' }[tab];
  $('#btnSettings').style.display = tab === 'settings' ? 'none' : '';
  // 记住每个标签的滚动位置：切走时保存，切回时恢复，视口不会跳动
  if (prevTab && prevTab !== tab) scrollPos[prevTab] = window.scrollY;
  requestAnimationFrame(() => window.scrollTo(0, scrollPos[tab] || 0));
}

      const dataUrl = await compressImage(file, 1080, 0.8);
      addItem({ id: uid(), type: 'photo', note: f.get('note') || '', photo: dataUrl, created_at: new Date().toISOString() });
    } else if (currentTab === 'home') {
      addItem({ id: uid(), type: 'anniversary', title: f.get('title'), content: f.get('content'), date: f.get('date'), created_at: new Date().toISOString() });
    } else {

});

/* 照片压缩：最长边 maxSize，质量 q */
function compressImage(file, maxSize, q) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width: w, height: h } = img;
      const scale = Math.min(1, maxSize / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', q));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

/* ================= 版本与更新 ================= */
$('#verNow').textContent = 'v' + APP_VERSION;

async function checkUpdate() {
  const st = $('#updateStatus');
  const btn = $('#btnCheckUpdate');
  btn.disabled = true; btn.textContent = '检查中…';
  try {
    // 强制从网络拿最新 index.html（绕过一切缓存）
    const res = await fetch('index.html?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.text();
    const m = html.match(/APP_VERSION\s*=\s*'([^']+)'/);
    const remoteVer = m ? m[1] : null;
    if (!remoteVer) throw new Error('无法解析版本');
    if (remoteVer === APP_VERSION) {
      st.textContent = `✅ 已是最新版本（v${APP_VERSION}）`;
    } else {
      st.textContent = `发现新版本 v${remoteVer}，正在更新…`;
      // 清空所有缓存并注销 Service Worker，然后强制刷新
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      location.replace(location.pathname + '?v=' + remoteVer);
    }
  } catch (e) {
    st.textContent = '❌ 检查失败：' + e.message + '（确认网络正常后再试）';
  }
  btn.disabled = false; btn.textContent = '检查更新';
}
$('#btnCheckUpdate').addEventListener('click', checkUpdate);
